name: CI

on:
  push:
  pull_request:

jobs:
  bun:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun-version: ["1.3.14", "latest"]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun test

      - run: bun run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run lint

  # Informational only — no threshold gate, never fails the build. Runs
  # alongside `bun` rather than after it so it doesn't add to CI wall time.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: bun test --coverage
        run: |
          set -o pipefail
          bun test --coverage --coverage-reporter=text --coverage-reporter=lcov \
            | tee coverage-summary.txt

      - name: publish coverage summary
        if: always()
        run: |
          {
            echo "### Coverage summary"
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/lcov.info
            coverage-summary.txt
          retention-days: 14

  # The shippable packages promise to be plain, portable JavaScript. Nothing
  # about a green `bun test` proves that — a `bun:` import or a Bun global in
  # any published @agentkit/* package passes the whole suite and breaks the
  # first Node consumer. So the dists are grepped and then actually executed
  # under Node. Every package the smoke loads is listed in both steps; adding a
  # published package means adding it here too.
  node-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: bun install --frozen-lockfile

      - run: bun run build

      # SQLite has separate runtime-specific entrypoints and native tests.
      # This portable import boundary also runs on Node 20; better-sqlite3
      # 13 requires Node >=22 and is never loaded by this smoke.
      - name: shippable dists import nothing from bun
        # `! grep` alone is vacuous when a dist is missing: grep exits 2 on a
        # missing path and the negation turns that into success. Prove every
        # dist exists first, then grep every import form (`from`, side-effect
        # `import "bun:x"`, dynamic `import("bun:x")`, `require`).
        run: |
          for d in packages/contracts packages/client packages/react packages/core \
                   packages/host packages/adapters-memory packages/runner-local \
                   packages/mcp-client packages/transport-http packages/mcp-server \
                   packages/testing; do
            test -d "$d/dist" || { echo "missing $d/dist"; exit 1; }
          done
          ! grep -rE "require\(['\"]bun|from ['\"]bun:|import\s*\(?\s*['\"]bun:" \
            packages/contracts/dist \
            packages/client/dist \
            packages/react/dist \
            packages/core/dist \
            packages/host/dist \
            packages/adapters-memory/dist \
            packages/runner-local/dist \
            packages/mcp-client/dist \
            packages/transport-http/dist \
            packages/mcp-server/dist \
            packages/testing/dist

      - run: node scripts/node-smoke.mjs

  # Packaging correctness one hop further out than node-smoke: actually `npm
  # pack` + `npm install` every publishable package, not just import its dist
  # from the checkout. Needs real npm registry access for each package's
  # non-workspace dependencies (typebox, ajv, the MCP SDK), so it is its own
  # job rather than a step tacked onto `bun` or `node-smoke`.
  pack-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: node scripts/pack-smoke.mjs

  # The single-install distribution model this repo ships: `agentkit`, the
  # umbrella package assembled by `scripts/build-umbrella.mjs` from the twelve
  # packages' dists, actually installs and works under both npm and bun.
  # Needs real npm/bun registry access for agentkit's real, non-workspace
  # dependencies (typebox, ajv, the MCP SDK), so it is its own job rather
  # than a step tacked onto `bun`, `node-smoke`, or `pack-smoke`.
  umbrella-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: bun run build:umbrella

      - run: bun run smoke:umbrella

      - name: qualify exact umbrella tarball
        run: |
          node scripts/source-digest.mjs . "$RUNNER_TEMP/source-manifest.json"
          npm pack ./packages/agentkit --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/pack.json"
          TARBALL=$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))[0].filename)' "$RUNNER_TEMP/pack.json")
          SOURCE_DIGEST=$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).sha256)' "$RUNNER_TEMP/source-manifest.json")
          node scripts/qualify-package.mjs --tarball "$RUNNER_TEMP/$TARBALL" --source-digest "$SOURCE_DIGEST" --output "$RUNNER_TEMP/qualification"

      - name: upload package qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-qualification
          path: |
            ${{ runner.temp }}/qualification/qualification.json
            ${{ runner.temp }}/qualification/*.log
            ${{ runner.temp }}/source-manifest.json
            ${{ runner.temp }}/agentkit-*.tgz
          retention-days: 14

  # Native SQLite has a narrower runtime range than portable imports.
  # Each runtime builds independently so a failed Bun source suite cannot
  # hide Node conformance, durability, or cross-runtime reopen failures.
  sqlite-node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run build:umbrella
      - run: node --test scripts/node-sqlite-conformance.mjs scripts/sqlite-durability.mjs

  sqlite-bun:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun-version: ["1.3.14", "latest"]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run build:umbrella
      - run: bun test ./scripts/sqlite-durability.mjs
        env:
          AGENTKIT_SQLITE_DRIVER: bun

  # Branch protection can require this stable name. All required matrices
  # must complete successfully; skipped or cancelled jobs never qualify.
  qualification:
    if: always()
    needs: [bun, lint, node-smoke, pack-smoke, umbrella-smoke, sqlite-node, sqlite-bun]
    runs-on: ubuntu-latest
    steps:
      - name: require all qualification jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            const jobs = Object.entries(JSON.parse(process.env.RESULTS));
            const failed = jobs.filter(([, job]) => job.result !== "success");
            for (const [name, job] of failed) console.error(name + ": " + job.result);
            if (jobs.length !== 7 || failed.length) process.exit(1);
          '
