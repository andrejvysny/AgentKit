name: CI

on:
  push:
  pull_request:

jobs:
  bun:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun-version: ["1.3.14", "latest"]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      # The Rust runtime is the only backend: the binding must be built before
      # any test runs (a missing binary is a hard failure, never a skip).
      # The cargo cache is shared with the `native` job of rust.yml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: bun run --cwd packages/native build:native

      # The mixed-runtime fixtures (packages/*/tests/rust-interop*.test.ts,
      # rust-stream-boundaries) prebuild the Rust http_fixture HERE: a cold
      # `cargo build` inside parallel test processes would race the shared
      # target dir and add minutes to the suite. The lazy build in
      # rust/tests/support/http-server.ts stays as a local-dev fallback.
      - run: bun run build:fixture

      # Full-run suites (coding-agent acceptance, durable execution) drive
      # real native runs with approval waits; bun 1.3.14 on CI runners
      # exceeded the 5s per-test default on them (external review at
      # 24b3d17: "plan mode blocks writes…" died at 5001ms with the run's
      # budget error surfacing beside it). Same convention the mixed-runtime
      # gates in rust.yml already use.
      - run: bun test --timeout 60000

      - run: bun run build

      - run: bun run build:umbrella

      - run: bun run check:api

      - run: AGENTKIT_CHECK_API_GATE=1 bun test scripts/tests/public-api.test.ts

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run lint

      # Structural migration gate (review 2026-11-01 §6.6): shipped
      # compositions execute the Rust backend through @agentkit/native;
      # backend-implementation imports fail the build (scripts/tests/
      # composition-ownership.test.ts pins the scanner itself).
      - run: bun run check:composition

  # Informational only — no threshold gate, never fails the build. Runs
  # alongside `bun` rather than after it so it doesn't add to CI wall time.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: bun run --cwd packages/native build:native

      - run: bun run build:fixture

      - name: bun test --coverage
        run: |
          set -o pipefail
          bun test --coverage --coverage-reporter=text --coverage-reporter=lcov \
            | tee coverage-summary.txt

      - name: publish coverage summary
        if: always()
        run: |
          {
            echo "### Coverage summary"
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/lcov.info
            coverage-summary.txt
          retention-days: 14

  # The shippable packages promise to be plain, portable JavaScript. Nothing
  # about a green `bun test` proves that — a `bun:` import or a Bun global in
  # any published @agentkit/* package passes the whole suite and breaks the
  # first Node consumer. So the dists are grepped and then actually executed
  # under Node. Every package the smoke loads is listed in both steps; adding a
  # published package means adding it here too.
  node-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: bun install --frozen-lockfile

      - run: bun run build

      # The core dist's runChat executes on the Rust runtime through
      # @agentkit/native, so the Node consumer needs the platform addon just
      # like the `bun` job does; without it the smoke dies at the core-dist
      # section with "the native binding failed to load" (external review at
      # 24b3d17: every Node lane failed exactly that way). The cargo cache
      # is shared with the `bun` job.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build native binding
        run: bun run --cwd packages/native build:native

      # SQLite has separate runtime-specific entrypoints and native tests.
      # This portable import boundary also runs on Node 20; better-sqlite3
      # 13 requires Node >=22 and is never loaded by this smoke.
      - name: shippable dists import nothing from bun
        # `! grep` alone is vacuous when a dist is missing: grep exits 2 on a
        # missing path and the negation turns that into success. Prove every
        # dist exists first, then grep every import form (`from`, side-effect
        # `import "bun:x"`, dynamic `import("bun:x")`, `require`).
        run: |
          for d in packages/contracts packages/client packages/react packages/core \
                   packages/host packages/adapters-memory packages/runner-local \
                   packages/mcp-client packages/transport-http \
                   packages/testing; do
            test -d "$d/dist" || { echo "missing $d/dist"; exit 1; }
          done
          ! grep -rE "require\(['\"]bun|from ['\"]bun:|import\s*\(?\s*['\"]bun:" \
            packages/contracts/dist \
            packages/client/dist \
            packages/react/dist \
            packages/core/dist \
            packages/host/dist \
            packages/adapters-memory/dist \
            packages/runner-local/dist \
            packages/mcp-client/dist \
            packages/transport-http/dist \
            packages/testing/dist

      - run: node scripts/node-smoke.mjs

  # Packaging correctness one hop further out than node-smoke: actually `npm
  # pack` + `npm install` every publishable package, not just import its dist
  # from the checkout. Needs real npm registry access for each package's
  # non-workspace dependencies (typebox, ajv, the MCP SDK), so it is its own
  # job rather than a step tacked onto `bun` or `node-smoke`.
  pack-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: node scripts/pack-smoke.mjs

  # The single-install distribution model this repo ships: `agentkit`, the
  # umbrella package assembled by `scripts/build-umbrella.mjs` from the twelve
  # packages' dists, actually installs and works under both npm and bun.
  # Needs real npm/bun registry access for agentkit's real, non-workspace
  # dependencies (typebox, ajv, the MCP SDK), so it is its own job rather
  # than a step tacked onto `bun`, `node-smoke`, or `pack-smoke`.
  umbrella-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: bun run build:umbrella

      - run: bun run smoke:umbrella

      # The qualification consumers below execute runChat on the Rust
      # runtime, so the platform addon must exist: qualify-package.mjs
      # installs the staged `@agentkit/native-<target>` package into every
      # consumer (the umbrella tarball itself never contains `*.node`).
      # Without the built binding the node-host exercise fails with
      # "the native binding failed to load" (external review at 24b3d17).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build native binding
        run: bun run --cwd packages/native build:native

      - name: qualify exact umbrella tarball
        run: |
          node scripts/source-digest.mjs . "$RUNNER_TEMP/source-manifest.json"
          npm pack ./packages/agentkit --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/pack.json"
          TARBALL=$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))[0].filename)' "$RUNNER_TEMP/pack.json")
          SOURCE_DIGEST=$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).sha256)' "$RUNNER_TEMP/source-manifest.json")
          node scripts/qualify-package.mjs --tarball "$RUNNER_TEMP/$TARBALL" --source-digest "$SOURCE_DIGEST" --output "$RUNNER_TEMP/qualification"

      - name: upload package qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-qualification
          path: |
            ${{ runner.temp }}/qualification/qualification.json
            ${{ runner.temp }}/qualification/*.log
            ${{ runner.temp }}/source-manifest.json
            ${{ runner.temp }}/agentkit-*.tgz
          retention-days: 14

  # Native SQLite has a narrower runtime range than portable imports.
  # Each runtime builds independently so a failed Bun source suite cannot
  # hide Node conformance, durability, or cross-runtime reopen failures.
  sqlite-node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run build:umbrella
      - run: node --test scripts/node-sqlite-conformance.mjs scripts/sqlite-durability.mjs

  sqlite-bun:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun-version: ["1.3.14", "latest"]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run build:umbrella
      - run: bun test ./scripts/sqlite-durability.mjs
        env:
          AGENTKIT_SQLITE_DRIVER: bun

  # Branch protection can require this stable name. All required matrices
  # must complete successfully; skipped or cancelled jobs never qualify.
  qualification:
    if: always()
    needs: [bun, lint, node-smoke, pack-smoke, umbrella-smoke, sqlite-node, sqlite-bun]
    runs-on: ubuntu-latest
    steps:
      - name: require all qualification jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          # jq (preinstalled on ubuntu-latest) instead of node: the gate is
          # the thing that must never depend on a runtime it is auditing, and
          # a missing or skipped suite must never count as success.
          echo "$RESULTS" | jq -e '
            (keys | length) == 7
            and (to_entries | all(.value.result == "success"))
          ' || exit 1
