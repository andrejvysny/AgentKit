name: CI

on:
  push:
  pull_request:

jobs:
  bun:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bun-version: ["1.2", "latest"]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun test

      - run: bun run build
