name: gates

on:
  pull_request:
  push:
    branches: [master, arch/cleanup]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install Rust toolchains
        # 1.97.0 comes from rust/rust-toolchain.toml; nightly is what
        # `cargo +nightly public-api` (rustdoc JSON) needs.
        run: |
          rustup toolchain install nightly --profile minimal \
            --component rustc-dev --component llvm-tools-preview

      - name: Install Rust gate tools
        run: |
          cargo install cargo-public-api@0.52.0 --locked
          cargo install cargo-deny@0.20.2 --locked
          cargo install cargo-machete@0.9.2 --locked

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Run gates
        run: node scripts/gates.mjs

      - name: Upload gate logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs
          path: .gate-logs/
          retention-days: 7
