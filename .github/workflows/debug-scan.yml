name: debug-scan (temporary)
on:
  workflow_dispatch:
  push:
    branches: [agentkit-phase-a-b]
    paths: [.github/workflows/debug-scan.yml]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Reproduce scanProc under load
        run: |
          cat > /tmp/scan3.mjs <<'EOF'
          import { readdir, readFile, stat } from "node:fs/promises";
          import { spawn } from "node:child_process";
          const EXEC_ID_ENV = "AGENTKIT_EXEC_ID";
          let firstThrow = null;
          let rounds = 0;
          const churn = () => {
            for (let i = 0; i < 60; i++) {
              const c = spawn("/bin/sleep", ["0.05"], { detached: true, env: { [EXEC_ID_ENV]: "999999:t" } });
              c.on("error", () => {});
            }
          };
          for (let round = 0; round < 120 && !firstThrow; round++) {
            rounds = round;
            churn();
            try {
              for (const name of await readdir("/proc")) {
                if (!/^\d+$/.test(name)) continue;
                const info = await stat("/proc/" + name).catch((e) => {
                  if (e.code === "ENOENT" || e.code === "ESRCH") return undefined;
                  throw Object.assign(e, { step: "stat", pid: name });
                });
                if (!info || (process.getuid && info.uid !== process.getuid())) continue;
                await readFile("/proc/" + name + "/environ", "latin1").catch((e) => {
                  if (e.code === "ENOENT" || e.code === "ESRCH") return "";
                  throw Object.assign(e, { step: "read", pid: name });
                });
              }
            } catch (e) {
              firstThrow = e;
            }
            await new Promise((r) => setTimeout(r, 5));
          }
          console.log(
            "uid=", process.getuid && process.getuid(),
            "rounds=", rounds,
            "firstThrow=", firstThrow ? `${firstThrow.step} pid=${firstThrow.pid} code=${firstThrow.code} msg=${firstThrow.message}` : "none",
          );
          // Also show every pid whose environ the current uid cannot read,
          // and what stat claims about its owner.
          const mismatches = [];
          for (const name of await readdir("/proc")) {
            if (!/^\d+$/.test(name)) continue;
            const info = await stat("/proc/" + name).catch(() => undefined);
            if (!info) continue;
            if (process.getuid && info.uid === process.getuid()) {
              const e = await readFile("/proc/" + name + "/environ", "latin1").catch((err) => err.code);
              if (typeof e === "string" && e !== "" && e !== "ENOENT" && e !== "ESRCH") {
                mismatches.push({ pid: name, code: e });
              }
            }
          }
          console.log("same-uid unreadable environ:", JSON.stringify(mismatches));
          EOF
          node /tmp/scan3.mjs
