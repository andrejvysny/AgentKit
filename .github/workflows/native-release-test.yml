name: Native release lane tests

# Secretless rehearsal of the publication lane. `native-release.yml` only
# ever runs at dispatch time from the default branch behind required
# reviewers — a lane that first executes at release time is a lane that
# fails at release time. This workflow runs the SAME code paths — the real
# `snapshot-release.mjs`, the real per-triple `build-native-release-artifact.mjs`
# (cross-compilation included), the real `check-native-artifact.mjs`
# isolated install, and the real `native-publish.mjs verify` — on every PR
# that touches the release machinery and on demand, with no credentials
# and no registry. `9.9.9` is a rehearsal-only version: nothing here can
# reach npm, so a placeholder is safe, and `verify` still exercises every
# lockstep/consistency rule it enforces for real releases.

on:
  pull_request:
    paths:
      - .github/workflows/native-release.yml
      - .github/workflows/native-release-test.yml
      - rust/scripts/**
      - scripts/release/**
      - scripts/snapshot-release.mjs
      - scripts/prepack-*.mjs
      - packages/native/**
      - packages/native-*/**
      - packages/agentkit/package.json
      - rust/crates/agentkit-napi/**
      - Cargo.lock
      - rust/Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-release-lane-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rehearsal-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      snapshot_sha256: ${{ steps.freeze.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Freeze the rehearsal snapshot at the placeholder version
        id: freeze
        run: |
          node scripts/snapshot-release.mjs "$RUNNER_TEMP/snapshot" 9.9.9 responses
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/native-snapshot.tar.gz" snapshot
          echo "sha256=$(sha256sum "$RUNNER_TEMP/native-snapshot.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Build inside the snapshot and pack the umbrella tarball
        working-directory: ${{ runner.temp }}/snapshot
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run build:umbrella
          mkdir -p "$RUNNER_TEMP/artifacts"
          npm pack ./packages/agentkit --pack-destination "$RUNNER_TEMP/artifacts"
          test -f "$RUNNER_TEMP/artifacts/agentkit-9.9.9.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: rehearsal-native-snapshot
          path: ${{ runner.temp }}/native-snapshot.tar.gz
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: rehearsal-native-umbrella
          path: ${{ runner.temp }}/artifacts/agentkit-9.9.9.tgz
          retention-days: 14

  rehearsal-build:
    needs: rehearsal-snapshot
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            key: linux-x64-gnu
            os: ubuntu-latest
            rust_targets: x86_64-unknown-linux-gnu
            cross: "false"
          - triple: aarch64-unknown-linux-gnu
            key: linux-arm64-gnu
            os: ubuntu-24.04-arm
            rust_targets: aarch64-unknown-linux-gnu
            cross: "false"
          - triple: aarch64-apple-darwin
            key: darwin-arm64
            os: macos-latest
            rust_targets: aarch64-apple-darwin
            cross: "false"
          - triple: x86_64-apple-darwin
            key: darwin-x64
            os: macos-latest
            rust_targets: x86_64-apple-darwin
            cross: "true"
          - triple: x86_64-pc-windows-msvc
            key: win32-x64-msvc
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            cross: "false"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rehearsal-native-snapshot
          path: ${{ runner.temp }}/dl
      - name: Unpack the frozen snapshot (digest-bound)
        env:
          SNAPSHOT_SHA256: ${{ needs.rehearsal-snapshot.outputs.snapshot_sha256 }}
        run: |
          echo "$SNAPSHOT_SHA256  $RUNNER_TEMP/dl/native-snapshot.tar.gz" | sha256sum -c -
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/dl/native-snapshot.tar.gz"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.rust_targets }}
      - name: Provision the x64-macOS cross toolchain
        if: matrix.key == 'darwin-x64'
        uses: ilammy/setup-nasm@v1
      - name: Install workspace dependencies (no compiled devDeps needed)
        working-directory: ${{ runner.temp }}/snapshot
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build the prebuilt platform artifact (the real release builder)
        working-directory: ${{ runner.temp }}/snapshot
        env:
          CROSS_FLAG: ${{ matrix.cross == 'true' && '--allow-cross' || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          node rust/scripts/build-native-release-artifact.mjs \
            --target ${{ matrix.triple }} \
            --out "$RUNNER_TEMP/out" $CROSS_FLAG
      - name: Verify the artifact (isolated offline install + acceptance)
        working-directory: ${{ runner.temp }}/snapshot
        run: |
          node rust/scripts/check-native-artifact.mjs \
            --manifest "$RUNNER_TEMP/out/artifact-manifest.${{ matrix.key }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: rehearsal-native-${{ matrix.key }}
          path: ${{ runner.temp }}/out
          retention-days: 14

  rehearsal-gate:
    # The publish job's own verification, run without credentials: every
    # manifest re-checked, tarballs re-hashed, lockstep and wrapper
    # byte-determinism enforced across jobs, umbrella pins verified. A red
    # gate here is exactly the red the gated publish would have caught.
    needs: [rehearsal-snapshot, rehearsal-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - uses: actions/download-artifact@v4
        with:
          pattern: rehearsal-native-*
          path: ${{ runner.temp }}/artifacts
          merge-multiple: true
      - name: Verify the complete artifact set (the real publish verifier)
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          node scripts/release/native-publish.mjs verify \
            "$RUNNER_TEMP/artifacts" 9.9.9 \
            --commit "$SOURCE_COMMIT"
