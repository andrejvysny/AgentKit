name: Qualify agentkit candidate

# Qualification never changes tags, branches, or publishes a package. A source
# tag remains immutable; distribution artifacts carry their own SHA-256 proof.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  qualification:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            electron: ""
          - os: macos-latest
            electron: "44.5.1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - name: Record source provenance
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          node scripts/source-digest.mjs . /tmp/agentkit-source-manifest.json
          mkdir candidate
          printf '%s\n%s\n' "$SOURCE_COMMIT" "$SOURCE_REF" > candidate/source-ref.txt
          cp /tmp/agentkit-source-manifest.json candidate/source-manifest.json
      - run: bun run build
      - run: bun run build:umbrella
      - run: node scripts/node-smoke.mjs
      - run: node --test scripts/node-sqlite-conformance.mjs scripts/sqlite-durability.mjs
      - run: AGENTKIT_SQLITE_DRIVER=bun bun test ./scripts/sqlite-durability.mjs
      - name: Pack once, qualify exact artifact
        env:
          ELECTRON_VERSION: ${{ matrix.electron }}
        run: |
          npm pack ./packages/agentkit --pack-destination candidate --json > candidate/pack.json
          TARBALL="$(node -p "require('./candidate/pack.json')[0].filename")"
          SOURCE_DIGEST="$(node -p "require('./candidate/source-manifest.json').sha256")"
          set -- node scripts/qualify-package.mjs --tarball "candidate/$TARBALL" --source-digest "$SOURCE_DIGEST" --output /tmp/agentkit-qualification
          if [ -f packages/core/src/providers/responses.ts ]; then set -- "$@" --responses true; fi
          if [ -n "$ELECTRON_VERSION" ]; then set -- "$@" --electron "$ELECTRON_VERSION"; fi
          "$@"
      - name: Preserve artifact and qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentkit-candidate-${{ github.sha }}-${{ matrix.os }}
          path: |
            candidate/
            /tmp/agentkit-qualification/qualification.json
            /tmp/agentkit-qualification/*.log
            /tmp/agentkit-qualification/*-consumer/*metafile.json
            /tmp/agentkit-qualification/*-consumer/*lock*
          if-no-files-found: error
