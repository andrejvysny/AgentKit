name: Qualify agentkit candidate

# Qualification preserves exact artifacts; publication is a separate approval.
on:
  workflow_dispatch:
    inputs:
      track:
        description: Foundation is independent; Responses adds migration qualification
        type: choice
        options: [foundation, responses]
        default: foundation
        required: true

permissions:
  contents: read

jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            electron: ""
          - os: macos-latest
            electron: "41.6.1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Qualify selected independent release track
        env:
          CANDIDATE_TRACK: ${{ inputs.track }}
          ELECTRON_VERSION: ${{ matrix.electron }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          node scripts/release/qualify-candidates.mjs "$RUNNER_TEMP/candidates"
      - name: Preserve artifacts, frozen sources, and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentkit-candidates-${{ inputs.track }}-${{ github.sha }}-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/candidates/foundation/
            ${{ runner.temp }}/candidates/responses/
          if-no-files-found: error
          retention-days: 90

  bun-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Require selected track on minimum Bun
        env:
          CANDIDATE_TRACK: ${{ inputs.track }}
          CANDIDATE_SOURCE_ONLY: "1"
        run: node scripts/release/qualify-candidates.mjs "$RUNNER_TEMP/minimum-bun"
      - name: Preserve minimum Bun failures and source proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentkit-minimum-bun-${{ inputs.track }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/minimum-bun/foundation/
            ${{ runner.temp }}/minimum-bun/responses/
          if-no-files-found: error

  acceptance:
    if: always()
    needs: [qualification, bun-minimum]
    runs-on: ubuntu-latest
    steps:
      - name: Require every qualification platform and minimum Bun
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          # shellcheck disable=SC2016
          node --input-type=module -e '
            const jobs = Object.entries(JSON.parse(process.env.RESULTS));
            const failed = jobs.filter(([, job]) => job.result !== "success");
            for (const [name, job] of failed) console.error(`${name}: ${job.result}`);
            if (jobs.length !== 2 || failed.length) process.exit(1);
          '
