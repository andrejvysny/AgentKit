name: Rust native SDK

on:
  push:
    paths: ["rust/**", "scripts/**", "packages/**", "bun.lock", "package.json", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "scripts/**", "packages/**", "bun.lock", "package.json", ".github/workflows/rust.yml"]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libgl1-mesa-dev pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
        working-directory: rust
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        working-directory: rust
      - run: cargo test --workspace --all-features --locked
        working-directory: rust
      - name: Shared store and client interoperability
        run: bun test scripts/tests/rust-store-conformance.test.ts scripts/tests/rust-runner-conformance.test.ts packages/client/tests/rust-interop.test.ts packages/client/tests/rust-stream-boundaries.test.ts packages/react/tests/rust-interop.test.ts packages/transport-http/tests/rust-interop.test.ts
        env:
          AGENTKIT_RUN_RUST_CONFORMANCE: "1"
          AGENTKIT_RUN_RUST_RUNNER_CONFORMANCE: "1"
      - name: Existing client and React behavior against Rust
        run: bun test --timeout 60000 packages/client/tests packages/react/tests
        env:
          AGENTKIT_TEST_BACKEND: rust
      - run: bun run typecheck
      # The binding binary is a build artifact; the qualification run must
      # produce it and then never let a suite silently skip (see the
      # AGENTKIT_REQUIRE_NATIVE fail-closed check in packages/native/tests).
      - name: Build native binding
        run: bun run --cwd packages/native build:native
      - name: Generated loader and d.ts are up to date
        # If the committed loader/d.ts drifted from what the Rust source
        # exports, the freshly built files differ from the checkout.
        run: git diff --exit-code -- packages/native/generated
      - name: Packed native package installs and runs the acceptance lifecycle
        # Build packages/native, npm pack it, npm install the tarball into an
        # isolated temp directory OUTSIDE the repo, and drive the FULL
        # acceptance lifecycle through the INSTALLED @agentkit/native — send
        # → committed events → approval wait → answer → resume → terminal
        # receipt → cancel → awaited close — plus a fresh-process reopen with
        # durable replay, under both Bun and node, with no Rust toolchain
        # reachable on PATH. Runs on EVERY matrix OS (Linux and macOS): the
        # packed artifact a consumer installs must qualify on the same SHA
        # and platform that built it, not only on Linux.
        run: node rust/scripts/check-native-package.mjs
      - run: bun test
        env:
          AGENTKIT_REQUIRE_NATIVE: "1"
      - name: Verify packaged consumers
        run: node rust/scripts/check-packages.mjs --offline
      - name: Mixed Rust/TypeScript client interop (required, never skipped here)
        # The pure Bun-free cargo test above also runs these; this named step
        # keeps the mixed-runtime coverage visible as its own required gate.
        # The workflow structure test refuses AGENTKIT_SKIP_TS_INTEROP in this
        # job, so a silent skip here cannot pass.
        run: cargo test -p agentkit-client --test interoperability --test all_routes --test typescript_boundaries --all-features --locked
        working-directory: rust
  # Windows qualifies the portable scope only: contracts, core execution, the
  # durable store, host services, transport, client and MCP. The coding pack
  # (`agentkit-toolpacks-coding`) and the facade re-exporting it (`agentkit-rust`)
  # are excluded because sandboxed command execution is built on Unix process
  # APIs (`libc::kill`, process groups, signals) with no Windows backend yet —
  # a named roadmap-M4 gap, not a silent skip. Bun IS provisioned here (with
  # `bun install --frozen-lockfile --ignore-scripts`, so the historical
  # `better-sqlite3` install failure can never mask a Rust result again) and
  # the five Bun-spawning MCP fixture tests run as a REQUIRED step below —
  # the Windows job is self-contained, not vacuous. The client interop suite
  # (all_routes, interoperability, typescript_boundaries), which drives the
  # full TypeScript service harness, stays in the `native` job's
  # mixed-runtime gate, and TS distribution gets qualified when the native
  # binding ships.
  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
        working-directory: rust
      - run: cargo clippy --workspace --exclude agentkit-rust --exclude agentkit-toolpacks-coding --all-targets --all-features --locked -- -D warnings
        working-directory: rust
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # The stdio MCP fixtures import the pinned `mcp-sdk-v1` workspace alias
      # (npm:@modelcontextprotocol/sdk@1.30.0), so the mixed-runtime step
      # below needs node_modules — but not any compiled devDependency:
      # --ignore-scripts keeps native install scripts (better-sqlite3) out of
      # this job's critical path.
      - run: bun install --frozen-lockfile --ignore-scripts
      # Workspace-wide pure-native suite. The client interop tests
      # (all_routes, interoperability, typescript_boundaries) spawn Bun
      # against the TypeScript service harness and belong to the mixed-runtime
      # gate in the `native` job, so this step opts them out explicitly. The
      # MCP Bun fixture tests are NOT lost to this opt-out: the required step
      # immediately below re-runs them for real. The workflow structure test
      # pins this variable here, forbids it in `native`, and requires the
      # Bun-provisioned MCP step.
      - name: Pure-native cargo test (client interop suite runs in the native job)
        run: cargo test --workspace --exclude agentkit-rust --exclude agentkit-toolpacks-coding --all-features --locked
        working-directory: rust
        env:
          AGENTKIT_SKIP_TS_INTEROP: "1"
      - name: MCP mixed-runtime fixture tests (Bun required, never skipped here)
        # Bun and the fixture SDK are provisioned in this job, so these five
        # fixture-spawning tests are a required gate: without Bun, or with
        # the fixture SDK missing, the harness fails loudly instead of
        # passing vacuously.
        run: cargo test -p agentkit-mcp --test bridge --test native --test security --test shapes --test manager --all-features --locked
        working-directory: rust
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun scripts/export-rust-fixtures.ts --check
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown
      - run: cargo check -p agentkit-contracts --target wasm32-unknown-unknown --locked
        working-directory: rust
  # Branch protection can require this stable name. All native matrices and
  # every gate job must complete successfully; a skipped, cancelled or
  # missing suite never counts as success. The workflow structure test
  # (scripts/tests/workflows.test.ts) executes this gate script with crafted
  # results and pins the env policy that keeps the mixed-runtime and
  # packaged-consumer suites from silently skipping.
  qualification:
    if: always()
    needs: [native, native-windows, contracts]
    runs-on: ubuntu-latest
    steps:
      - name: require all native qualification jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          # No node here: the gate must pass on the bare runner (and be
          # testable on hosts without a node binary). jq is preinstalled on
          # ubuntu-latest. A missing or skipped suite is never success.
          echo "$RESULTS" | jq -e '
            (keys | length) == 3
            and (to_entries | all(.value.result == "success"))
          ' || exit 1
