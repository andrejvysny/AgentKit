[workspace]
members = ["crates/*", "examples/egui-host"]
default-members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["preserve_order", "arbitrary_precision", "raw_value"] }
sha2 = "=0.10.9"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
futures = "=0.3.32"
async-trait = "=0.1.89"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
