[package]
name = "agentkit-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "AgentKit native SDK integration facade"
repository = "https://github.com/andrejvysny/AgentKit"
readme = "../../../README.md"

[lints]
workspace = true

[features]
default = []
runtime = ["dep:agentkit-core", "dep:agentkit-connections"]
durable = ["runtime", "dep:agentkit-engine", "dep:agentkit-sessions", "dep:agentkit-chat", "dep:agentkit-governance", "dep:agentkit-store", "dep:agentkit-providers"]
client = ["dep:agentkit-client"]
http = ["durable", "dep:agentkit-http"]
mcp = ["dep:agentkit-mcp"]
coding = ["durable", "dep:agentkit-toolpacks-coding"]
keychain = ["runtime", "agentkit-connections/os-keychain"]

[dependencies]
agentkit-contracts = { workspace = true }
agentkit-core = { workspace = true, optional = true }
agentkit-connections = { workspace = true, optional = true }
agentkit-engine = { workspace = true, optional = true }
agentkit-sessions = { workspace = true, optional = true }
agentkit-chat = { workspace = true, optional = true }
agentkit-governance = { workspace = true, optional = true }
agentkit-store = { workspace = true, optional = true }
agentkit-providers = { workspace = true, optional = true }
agentkit-client = { workspace = true, optional = true }
agentkit-http = { workspace = true, optional = true }
agentkit-mcp = { workspace = true, optional = true }
agentkit-toolpacks-coding = { workspace = true, optional = true }
