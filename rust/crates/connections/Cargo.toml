[package]
name = "agentkit-connections"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "App-isolated native connections, consent, and secure credential ports"
repository = "https://github.com/andrejvysny/AgentKit"
readme = "README.md"

[lints]
workspace = true

[features]
default = []
os-keychain = ["dep:keyring"]
http = ["dep:reqwest"]
reqwest-transport = ["http"]

[dependencies]
agentkit-contracts = { workspace = true }
async-trait.workspace = true
keyring = { workspace = true, optional = true, features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
url = { workspace = true, features = ["serde"] }
zeroize.workspace = true

[dev-dependencies]
uuid.workspace = true

[[example]]
name = "keychain_qualification"
required-features = ["os-keychain"]
