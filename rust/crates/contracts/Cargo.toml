[package]
name = "agentkit-contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Canonical AgentKit contracts, validation, and identity hashing"
repository = "https://github.com/andrejvysny/AgentKit"
readme = "README.md"

[lints]
workspace = true

[dependencies]
agentkit-kernel.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
jsonschema = { version = "=0.33.0", default-features = false }
ryu-js = "=1.0.3"
regress = { version = "=0.12.0", features = ["utf16"] }
fluent-uri = "=0.3.2"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
