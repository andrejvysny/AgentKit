[package]
name = "agentkit-facade"
description = "OPTIONAL standalone high-level facade for driving one native Chat turn without the durable host, plus the driver conformance harness (AGENTKIT-117)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
agentkit-native = { path = "../native" }
agentkit-claude = { path = "../claude" }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }

[dev-dependencies]
agentkit-native = { path = "../native" }
agentkit-claude = { path = "../claude" }
async-trait = { workspace = true }
serde_json = { workspace = true }
tempfile = "=3.27.0"
