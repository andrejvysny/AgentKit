[package]
name = "agentkit-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Durable native execution host for AgentKit"
repository = "https://github.com/andrejvysny/AgentKit"
readme = "../../../README.md"
# Binary SQLite fixtures are test-only and trip the package privacy gate
# (rust/scripts/check-packages.mjs refuses *.sqlite in a crate archive).
exclude = ["tests/fixtures/**/*.sqlite"]

[features]
default = []
http = ["dep:agentkit-transport-http", "dep:axum"]

[[example]]
name = "native-chat-lifecycle"
required-features = ["http"]

# The HTTP teammates conformance lane compiles only with `http`; without the
# required-features declaration `cargo test --test http_teammates` reports a
# vacuous green "0 passed". Run it as:
#   cargo test --locked -p agentkit-host --features http --test http_teammates
[[test]]
name = "http_teammates"
required-features = ["http"]

[dependencies]
agentkit-store = { path = "../store", version = "0.1.0" }
agentkit-core = { path = "../core", version = "0.1.0" }
agentkit-contracts = { path = "../contracts", version = "0.1.0" }
agentkit-native = { path = "../native", version = "0.1.0" }
agentkit-connections = { path = "../connections", version = "0.1.0", features = ["http"] }
agentkit-mcp = { path = "../mcp", version = "0.1.0" }
agentkit-transport-http = { path = "../transport-http", version = "0.1.0", optional = true }
axum = { version = "=0.8.8", optional = true }
serde.workspace = true
reqwest.workspace = true
futures.workspace = true
async-trait.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "v7"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "=1.13.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The instruction reader's identity check (project_instructions/fs.rs) queries
# the opened handle through `GetFileInformationByHandle`; the `std` getters for
# the same fields are unstable (`windows_by_handle`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
agentkit-mcp = { path = "../mcp", version = "0.1.0" }
# Review round-3 F4: the deadline-chain guard test reads the claude
# adapter's outer MCP budget alongside the host's authorize budget.
# (dev-only: claude sits ABOVE host, so this never creates a cycle.)
agentkit-claude = { path = "../claude", version = "0.1.0" }
rusqlite = { version = "0.38", features = ["bundled"] }
tempfile = "3"
# The imported-receipt acceptance tests drive the TypeScript importer
# against bun-generated fixtures.
agentkit-store = { path = "../store", version = "0.1.0", features = ["ts-import"] }
