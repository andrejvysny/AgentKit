[package]
name = "agentkit-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Durable native execution host for AgentKit"
repository = "https://github.com/andrejvysny/AgentKit"
readme = "../../../README.md"

[features]
default = []
http = ["dep:agentkit-transport-http", "dep:axum"]

[dependencies]
agentkit-store = { path = "../store", version = "0.1.0" }
agentkit-core = { path = "../core", version = "0.1.0" }
agentkit-contracts = { path = "../contracts", version = "0.1.0" }
agentkit-connections = { path = "../connections", version = "0.1.0", features = ["http"] }
agentkit-transport-http = { path = "../transport-http", version = "0.1.0", optional = true }
axum = { version = "=0.8.8", optional = true }
serde.workspace = true
reqwest.workspace = true
futures.workspace = true
async-trait.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "=1.13.1"

[dev-dependencies]
rusqlite = { version = "0.38", features = ["bundled"] }
