[package]
name = "agentkit-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Durable native execution host for AgentKit"
repository = "https://github.com/andrejvysny/AgentKit"
readme = "../../../README.md"
# Binary SQLite fixtures are test-only and trip the package privacy gate
# (rust/scripts/check-packages.mjs refuses *.sqlite in a crate archive).
exclude = ["tests/fixtures/**/*.sqlite"]

[lints]
workspace = true

[dependencies]
agentkit-store = { workspace = true }
agentkit-core = { workspace = true }
agentkit-governance = { workspace = true }
agentkit-contracts = { workspace = true }
agentkit-kernel = { workspace = true }
serde.workspace = true
reqwest.workspace = true
futures.workspace = true
async-trait.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
uuid = { workspace = true, features = ["v7"] }
chrono = { workspace = true, features = ["clock"] }
regex.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The instruction reader's identity check (project_instructions/fs.rs) queries
# the opened handle through `GetFileInformationByHandle`; the `std` getters for
# the same fields are unstable (`windows_by_handle`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
agentkit-mcp = { workspace = true }
rusqlite = { workspace = true, features = ["bundled"] }
tempfile.workspace = true
# The imported-receipt acceptance tests drive the TypeScript importer
# against bun-generated fixtures.
agentkit-store = { workspace = true, features = ["ts-import"] }
