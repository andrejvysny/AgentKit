[package]
name = "agentkit-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "AgentKit MCP client and server transports"
repository = "https://github.com/andrejvysny/AgentKit"
readme = "README.md"

[lints]
workspace = true

[dependencies]
agentkit-contracts = { workspace = true }
agentkit-core = { workspace = true }
async-trait.workspace = true
futures.workspace = true
axum.workspace = true
http.workspace = true
http-body-util = "=0.1.5"
reqwest.workspace = true
rmcp = { version = "=3.9.0", default-features = false, features = ["auth", "server", "client", "transport-child-process", "transport-streamable-http-client-reqwest", "transport-streamable-http-server", "reqwest"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "=2.6.1"
sse-stream = "=0.2.6"
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-util.workspace = true
tower = { workspace = true, features = ["util"] }
tracing = "=0.1.44"
uuid.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
