[package]
name = "agentkit-napi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Thin Node-API binding over the native AgentKit runtime"
repository = "https://github.com/andrejvysny/AgentKit"

[lints]
workspace = true

[lib]
name = "agentkit_napi"
crate-type = ["cdylib", "rlib"]

[dependencies]
agentkit-store = { workspace = true }
agentkit-host = { workspace = true, features = ["http"] }
agentkit-core = { workspace = true }
agentkit-connections = { workspace = true }
agentkit-mcp = { workspace = true }
agentkit-contracts = { workspace = true }
agentkit-transport-http = { workspace = true }
agentkit-toolpacks-coding = { workspace = true }
agentkit-lsp = { workspace = true }
libc.workspace = true
axum.workspace = true
http.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
napi = { version = "=3.15.0", default-features = false, features = ["napi9", "async", "tokio_rt"] }
napi-derive = { version = "=3.6.13", default-features = false, features = ["strict", "type-def"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
reqwest.workspace = true
uuid.workspace = true
