[package]
name = "agentkit-napi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Thin Node-API binding over the native AgentKit runtime"
repository = "https://github.com/andrejvysny/AgentKit"

[lib]
name = "agentkit_napi"
crate-type = ["cdylib", "rlib"]

[dependencies]
agentkit-store = { path = "../store", version = "0.1.0" }
agentkit-host = { path = "../host", version = "0.1.0" }
agentkit-core = { path = "../core", version = "0.1.0" }
agentkit-contracts = { path = "../contracts", version = "0.1.0" }
napi = { version = "=3.15.0", default-features = false, features = ["napi9", "async", "tokio_rt"] }
napi-derive = { version = "=3.6.13", default-features = false, features = ["strict", "type-def"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
uuid = { version = "1", features = ["v4"] }
