[package]
name = "agentkit-sandbox-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Trusted host-side bridge to the AgentKit sandbox worker daemon: UDS wire client, bindings store, reconciliation"

[dependencies]
agentkit-sandbox-contracts = { path = "../sandbox-contracts", version = "0.1.0" }
async-trait.workspace = true
base64.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
rusqlite = { version = "0.38", features = ["bundled"] }

# Compiled into the test launcher bin below: the worker daemon code is
# reused verbatim (the host bridge never reimplements worker semantics).
agentkit-sandbox-worker = { path = "../sandbox-worker", version = "0.1.0" }

[dev-dependencies]
tempfile = "3"

# Faithful worker daemon for the host-bridge L1 tests: compiles the worker
# crate's own `src/bin` entry point verbatim (normalized by build.rs into an
# `include!`-legal copy) under a unique artifact name, so
# `cargo test -p agentkit-sandbox-host` always exercises the current worker
# CLI with no stale-binary risk.
[[bin]]
name = "agentkit-sandbox-worker-testbin"
path = "src/bin/worker_testbin.rs"
