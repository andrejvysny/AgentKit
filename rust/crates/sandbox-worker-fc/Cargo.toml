[package]
name = "agentkit-sandbox-worker-fc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Firecracker/KVM/jailer SandboxBackend for the AgentKit VM sandbox worker (Linux)"
repository = "https://github.com/andrejvysny/AgentKit"

[dependencies]
agentkit-sandbox-contracts = { path = "../sandbox-contracts", version = "0.1.0" }
async-trait.workspace = true
base64.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tempfile = "3"
