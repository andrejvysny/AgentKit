[package]
name = "agentkit-sandbox-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Unprivileged AgentKit VM sandbox worker daemon: journal, registry, UDS transport, guest links, backends"

[dependencies]
agentkit-sandbox-contracts = { path = "../sandbox-contracts", version = "0.1.0" }
async-trait.workspace = true
base64.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
reqwest.workspace = true
flate2 = "=1.1.10"

# Optional concrete Firecracker backend (integrator crate); linked only with
# `--features firecracker`. Without it, `--backend firecracker` fails closed.
agentkit-sandbox-worker-fc = { path = "../sandbox-worker-fc", version = "0.1.0", optional = true }
agentkit-sandbox-worker-apple = { path = "../sandbox-worker-apple", version = "0.1.0", optional = true }

[dev-dependencies]
tempfile = "3"
flate2 = "=1.1.10"
reqwest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }

[features]
# Links the concrete firecracker backend (integrator's crate).
firecracker = ["dep:agentkit-sandbox-worker-fc"]
# Links the Virtualization.framework adapter (macOS hosts, spec §12.2).
apple = ["dep:agentkit-sandbox-worker-apple"]

[[bin]]
name = "agentkit-sandbox-worker"
path = "src/bin/agentkit-sandbox-worker.rs"
