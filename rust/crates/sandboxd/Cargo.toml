[package]
name = "agentkit-sandboxd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Guest supervisor of the Track B sandbox (ADR 0039): runs commands and file operations for the host over the framed protocol"
repository = "https://github.com/andrejvysny/AgentKit"
readme = "../../../README.md"

[lints]
workspace = true

[dependencies]
agentkit-sandbox-proto.workspace = true
agentkit-sys.workspace = true
# Request and reply envelopes are parsed and sized as JSON.
serde_json.workspace = true
# Write digests are checked while the data streams in.
sha2.workspace = true
thiserror.workspace = true
# Control channel, egress shim, timers and the output pipes.
tokio.workspace = true
# Unpredictable names for temp files and for log directories set aside.
uuid.workspace = true

[dev-dependencies]
# Scratch roots for the file and server tests.
tempfile.workspace = true
