[package]
name = "agentkit-store"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version.workspace = true
description = "SQLite persistence and execution leases for AgentKit"
repository = "https://github.com/andrejvysny/AgentKit"
readme = "../../../README.md"

[dependencies]
agentkit-contracts = { path = "../contracts", version = "0.1.0" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rusqlite = { version = "0.38", features = ["hooks"] }
tempfile = "3"
