[package]
name = "agentkit-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "SQLite persistence and execution leases for AgentKit"
repository = "https://github.com/andrejvysny/AgentKit"
readme = "../../../README.md"

[lints]
workspace = true

[dependencies]
agentkit-contracts = { workspace = true }
agentkit-engine = { workspace = true }
agentkit-kernel = { workspace = true }
# The MCP configuration context owns the port this crate adapts (ADR 0024 §2):
# an adapter depends on its context, never the reverse.
agentkit-mcp = { workspace = true }
agentkit-native = { workspace = true }
# The sessions context owns the port this crate adapts (ADR 0024 §2): an
# adapter depends on its context, never the reverse.
agentkit-sessions = { workspace = true }
async-trait.workspace = true
chrono = { workspace = true, features = ["std"] }
# AGENTKIT-72 at-rest sealing. `ring` is already in the workspace Cargo.lock
# (the rustls stack behind the `http` feature); this edge adds no new crate to
# the build graph and keeps the pinned lockfile green.
ring = "=0.17.14"
rusqlite = { workspace = true, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid = { workspace = true, features = ["v7"] }

[features]
# Off by default: importing a TypeScript adapters-sqlite database is a migration
# step, not something every consumer pays to compile.
ts-import = []

[dev-dependencies]
agentkit-testkit = { workspace = true }
rusqlite = { workspace = true, features = ["hooks"] }
tempfile.workspace = true
