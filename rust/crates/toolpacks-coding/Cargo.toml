[package]
name = "agentkit-toolpacks-coding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Confined coding tool pack for AgentKit: filesystem read/search/edit, read-only git, sandboxed commands"
repository = "https://github.com/andrejvysny/AgentKit"

[lints]
workspace = true

[dependencies]
agentkit-contracts = { workspace = true }
agentkit-kernel = { workspace = true }
agentkit-core = { workspace = true }
agentkit-governance = { workspace = true }
agentkit-sys = { workspace = true }
async-trait.workspace = true
futures.workspace = true
libc.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "process"] }
tokio-util = { workspace = true, features = ["rt"] }
unicode-normalization = "=0.1.26"
uuid.workspace = true

[dev-dependencies]
agentkit-chat = { workspace = true }
agentkit-engine = { workspace = true }
agentkit-sessions = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
agentkit-store = { workspace = true }
futures.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
sha2.workspace = true
tempfile.workspace = true
