[package]
name = "agentkit-toolpacks-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Web tool pack for AgentKit: web_search backed by a self-hosted SearXNG instance"
repository = "https://github.com/andrejvysny/AgentKit"

[lints]
workspace = true

[dependencies]
agentkit-core = { workspace = true }
agentkit-governance = { workspace = true }
async-trait.workspace = true
chrono = { workspace = true, features = ["clock", "std"] }
encoding_rs = "=0.8.35"
htmd = "=0.6.0"
reqwest.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
tokio-util.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
agentkit-chat = { workspace = true }
agentkit-engine = { workspace = true }
agentkit-sessions = { workspace = true }
agentkit-store = { workspace = true }
async-trait.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
