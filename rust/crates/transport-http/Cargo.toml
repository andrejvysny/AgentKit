[package]
name = "agentkit-transport-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Authenticated AgentKit REST and resumable event-stream routes"
repository = "https://github.com/andrejvysny/AgentKit"
readme = "../../../README.md"

[dependencies]
agentkit-contracts = { path = "../contracts", version = "0.1.0" }
async-trait.workspace = true
axum = "=0.8.8"
