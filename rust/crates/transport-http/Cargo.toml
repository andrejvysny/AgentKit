futures.workspace = true
serde.workspace = true
serde_json.workspace = true
percent-encoding = "=2.3.2"
tokio.workspace = true
url = "=2.5.8"

[dev-dependencies]
reqwest.workspace = true
tower = { version = "=0.5.3", features = ["util"] }
